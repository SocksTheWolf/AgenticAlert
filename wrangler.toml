name="agenticalert"
compatibility_date = "2026-10-25"
preview_urls = false
workers_dev = false
send_metrics = false

routes = [
  { pattern = "agenticalert.download", custom_domain = true },
  { pattern = "www.agenticalert.download", custom_domain = true }
]

[build]
command = "npm run build"

[cache]
enabled = true

[assets]
directory = "./site"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

name: Build & Submit Extension
on:
  workflow_run:
    workflows: [Release Completed]
    types:
      - completed

  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  deployments: write

concurrency:
  group: "submission-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deployClean:
    name: Clean Deployments
    uses: socksthewolf/workflows/.github/workflows/clean_deploys.yml@main
    secrets: inherit
    with:
      environment: submission

  build:
    name: Build
    runs-on: "ubuntu-latest"
    environment: submission
    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".node-version"
          package-manager-cache: true
          cache-dependency-path: "package-lock.json"
          cache: "npm"

      - name: Install Packages
        run: npm ci

      - name: Extract version
        id: version
        run: |-
          VERSIONSTR=$(cat src/agenticalert.js | sed -n "s/^\/\/ \@version\s*\([0-9]*\.[0-9]*\.[0-9]*\)/\1/p")
          echo "version=$VERSIONSTR" >> "$GITHUB_OUTPUT"

      - name: Replace version number
        uses: SocksTheWolf/github-action-json@16bc21c07e9d1742439f43d3060f2debce83b247
        with:
          path: "manifest.json"
          replaceWith: |
            {
              "version": "${{ steps.version.outputs.version }}"
            }

      - name: Build Extension Zip
        run: npm run extbuild

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ext/extension.zip
          archive: false
          name: "WebPackedExt"

      - name: Push to Chrome
        uses: cssnr/webstore-publish-action@9c4e7ae29beb517bf2d22f32d849455d178cbca6
        with:
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher_id: ${{ secrets.CHROME_PUBLISHER_ID }}
          zip_file: "ext/extension.zip"
          cancel: true
          publish: default
          json_data: ${{ secrets.CHROME_AUTH }}


      - name: Push to Firefox
        uses: creeperkatze/extension-publish@67710e469fb1db85eac50c0cfe18779f9de5bdfb
        with:
          firefox-xpi-path:     "ext/extension.zip"
          firefox-license:      "GPL-3.0-only"
          firefox-api-key:      ${{ secrets.FIREFOX_API_KEY }}
          firefox-api-secret:   ${{ secrets.FIREFOX_API_SECRET }}
          firefox-extension-id: ${{ secrets.FIREFOX_EXTENSION_ID }}

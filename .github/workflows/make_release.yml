name: Make Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  release:
    name: "Releasing"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Deep Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |-
          VERSIONSTR=$(cat src/agenticalert.js | sed -n "s/^\/\/ \@version\s*\([0-9]*\.[0-9]*\.[0-9]*\)/\1/p")
          echo "version=$VERSIONSTR" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".node-version"
          package-manager-cache: true
          cache-dependency-path: "package-lock.json"
          cache: "npm"

      - name: Install Packages
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Generate Release Notes
        id: notes
        uses: nayandas69/smart-release-notes-action@9bd95340f63c56384cb39feffee60ea54da0f054
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body: ${{ steps.notes.outputs.changelog }}
          name: "v${{ steps.version.outputs.version }}"
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            - **/site/agenticalert.user.js
            - **/site/agentdetections.js

  extension:
    name: "Submit Extensions"
    needs: release
    if: ${{ needs.release.result == 'success' }}
    uses: $/.github/workflows/submit.yml
    secrets: inherit
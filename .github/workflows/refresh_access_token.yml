name: "Refresh Chrome Access Tokens"
on:
  schedule:
    - cron:  '0 3 2 * *' # At 03:00 on day-of-month 2

permissions:
  deployments: write

jobs:
  deployClean:
    name: Clean Deployments
    uses: socksthewolf/workflows/.github/workflows/clean_deploys.yml@main
    secrets: inherit
    with:
      environment: refresh_token

  fetchToken:
    runs-on: ubuntu-latest
    environment: refresh_token
    steps:
      - uses: cardinalby/google-api-fetch-token-action@f455422472a558d48d939e77a65cdcec38e707b5
        with:
          clientId: ${{ secrets.G_API_CLIENT_ID }}
          clientSecret: ${{ secrets.G_API_CLIENT_SECRET }}
          refreshToken: ${{ secrets.G_API_REFRESH_TOKEN }}
name: Add a new fingerprint
description: For adding genAI markers (files/folders/phrases) that known LLMs create/use
title: '[FINGERPRINT]: '
labels: ['fingerprinting']

body:
  - type: textarea
    attributes:
      label: What are the file/files/directories/phrases that should be added?
      description: |
        Please make sure that we are not already tracking them.
    validations:
      required: true

  - type: input
    attributes:
      label: What agent uses these?
      description: Please provide name/link to said agent (if file/directory)

  - type: textarea
    attributes:
      label: Where can these be found?
      description: Please list links to repositories that have these markers.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other Comments?
      description: Evidence, proof of slop, or anything else can go here

